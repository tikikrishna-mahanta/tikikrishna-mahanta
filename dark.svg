<svg xmlns="http://www.w3.org/2000/svg"
     width="1180"
     height="610"
     viewBox="0 0 1180 610">

<defs>

  <!-- ===================================================== -->
  <!-- ACCENT -->
  <!-- ===================================================== -->

  <linearGradient id="accent"
                  x1="0%" y1="0%"
                  x2="100%" y2="100%">

    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="50%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#10B981"/>

    <animateTransform
      attributeName="gradientTransform"
      type="rotate"
      from="0 590 305"
      to="360 590 305"
      dur="14s"
      repeatCount="indefinite"/>

  </linearGradient>


  <linearGradient id="textAccent"
                  x1="0%" y1="0%"
                  x2="100%" y2="0%">

    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="55%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#10B981"/>

  </linearGradient>


  <!-- ===================================================== -->
  <!-- AURA -->
  <!-- ===================================================== -->

  <radialGradient id="cyanAura">

    <stop offset="0%"
          stop-color="#22D3EE"
          stop-opacity=".12"/>

    <stop offset="100%"
          stop-color="#22D3EE"
          stop-opacity="0"/>

  </radialGradient>


  <radialGradient id="violetAura">

    <stop offset="0%"
          stop-color="#7C3AED"
          stop-opacity=".11"/>

    <stop offset="100%"
          stop-color="#7C3AED"
          stop-opacity="0"/>

  </radialGradient>


  <!-- ===================================================== -->
  <!-- GLOW -->
  <!-- ===================================================== -->

  <filter id="glow"
          x="-100%"
          y="-100%"
          width="300%"
          height="300%">

    <feGaussianBlur stdDeviation="4"/>

  </filter>


  <!-- ===================================================== -->
  <!-- FRAME -->
  <!-- ===================================================== -->

  <clipPath id="frame">

    <rect width="1180"
          height="610"
          rx="26"/>

  </clipPath>

</defs>


<g clip-path="url(#frame)">


