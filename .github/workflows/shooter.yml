name: Generate GitHub Space Shooter

on:
  schedule:
    - cron: "0 0 * * *"   # Runs completely automatically every single night
  workflow_dispatch:      # Gives you the manual test button

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make Game Animation
        uses: czl9707/gh-space-shooter@v2
        with:
          username: ${{ github.repository_owner }} # Changed to the correct input name!
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'github-space-shooter.gif'
          no-commit: true                          # Keeps your main README completely untouched

      - name: Save to a Safe Secret Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .        
          branch: assets                           # Safely dumps the GIF into an "assets" branch
